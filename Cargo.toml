[workspace]
resolver = "3"
members = ["cli", "lib", "lib/gen-protos"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
jj-spice-lib = { path = "lib", version = "0.3.0" }

clap = { version = "4.6.10", features = ["derive"] }
clap_complete = { version = "4.6.12", features = ["unstable-dynamic"] }
clap_complete_nushell = "4.6.3"
dunce = "1"
futures = "0.3.32"
gix = { version = "0.90.0", default-features = false }
http = "1"
http-body-util = "0.1"
itertools = "0.15.0"
jiff = "0.2"
jj-cli = "0.47.1"
jj-lib = "0.47.1"
octocrab = "0.54.9"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"

reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde_json = "1"
wiremock = "0.6"
